<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Stage — KOTAO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar"><div class="wrap" id="nav"></div></header>

<div class="hero">
  <div class="wrap">
    <h1>Group Stage</h1>
    <div class="tagline" id="hero-tagline"></div>
  </div>
</div>

<main class="wrap">

  <section>
    <div class="section-head"><h2>Standings</h2></div>
    <div class="panel" id="standings"></div>
  </section>

  <section>
    <div class="section-head"><h2>Head to Head</h2><span class="note" id="h2h-note"></span></div>
    <div class="panel" id="h2h"></div>
  </section>

  <section>
    <div class="section-head"><h2>Match Report</h2></div>
    <div id="matchdays"></div>
  </section>

</main>

<footer>
  <div class="wrap">KOTAO — generated from the official tracker. Format details on the
    <a id="link-rules" href="rules.html">Format &amp; Rules page</a>.
    <div id="updated-stamp" class="stamp"></div></div>
</footer>

<script src="js/logic.js"></script>
<script src="data/data.js"></script>
<script src="js/render.js"></script>
<script>
const t = buildTournament(pickTournament(RAW_DATA, currentId()));
renderNav('group', t);
document.title = 'Group Stage — ' + t.name;
document.getElementById('link-rules').href = href('rules.html', t.id);
document.getElementById('hero-tagline').textContent =
  'Every team plays every other team once, across 5 matchdays. '
  + 'Each match: ' + formatLabel(t.groupRows[0].stats.format) + '.';

renderStandingsTable(document.getElementById('standings'), t);
const tieNote = tieNoticeEl(t);
if (tieNote) {
  const box = document.getElementById('standings');
  box.parentNode.insertBefore(tieNote, box);
}
document.getElementById('h2h-note').textContent = isAgg(t)
  ? 'Rounds on top, goals below - the goals decide the match. Row team first.'
  : 'Rounds won, row team first';
renderHeadToHead(document.getElementById('h2h'), t);
renderMatchdays(document.getElementById('matchdays'), t);

renderUpdatedStamp(RAW_DATA.generatedAt);
</script>
</body>
</html>
